<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f2438"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="chartFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.4)"/>
      <stop offset="100%" stop-color="rgba(6, 182, 212, 0.0)"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#p2Bg)"/>

  <!-- Telemetry Dashboard Mockup UI -->
  <g transform="translate(30, 30)">
    <!-- Main Panel -->
    <rect width="540" height="320" rx="16" fill="#111827" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

    <!-- Top Status Header -->
    <rect x="20" y="20" width="160" height="36" rx="8" fill="#1f2937"/>
    <circle cx="36" cy="38" r="5" fill="#10b981"/>
    <text x="50" y="42" font-family="'Courier New', monospace" font-size="12" fill="#34d399">Cluster: US-East-1 (Healthy)</text>

    <rect x="190" y="20" width="160" height="36" rx="8" fill="#1f2937"/>
    <text x="205" y="42" font-family="'Courier New', monospace" font-size="12" fill="#93c5fd">Pods: 142 Active</text>

    <rect x="360" y="20" width="160" height="36" rx="8" fill="#1f2937"/>
    <text x="375" y="42" font-family="'Courier New', monospace" font-size="12" fill="#f59e0b">Avg Latency: 12.4ms</text>

    <!-- Chart Window -->
    <g transform="translate(20, 75)">
      <rect width="320" height="220" rx="12" fill="#0b1120" stroke="rgba(255,255,255,0.06)"/>
      <text x="18" y="25" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#cbd5e1">Throughput RPS (Last 1 Hour)</text>
      
      <!-- Graph Axes -->
      <line x1="20" y1="180" x2="300" y2="180" stroke="#334155" stroke-width="1"/>
      <line x1="20" y1="45" x2="20" y2="180" stroke="#334155" stroke-width="1"/>
      
      <!-- Chart Area & Path -->
      <path d="M 20 160 L 50 145 L 90 155 L 130 110 L 170 130 L 210 90 L 250 95 L 300 70 L 300 180 L 20 180 Z" fill="url(#chartFill)"/>
      <path d="M 20 160 L 50 145 L 90 155 L 130 110 L 170 130 L 210 90 L 250 95 L 300 70" fill="none" stroke="#06b6d4" stroke-width="3"/>
      
      <circle cx="210" cy="90" r="4" fill="#38bdf8"/>
      <circle cx="300" cy="70" r="5" fill="#22d3ee"/>
      
      <text x="210" y="75" font-family="'Courier New', monospace" font-size="10" fill="#38bdf8" text-anchor="middle">48.2k rps</text>
    </g>

    <!-- Right Side Pod Breakdown -->
    <g transform="translate(360, 75)">
      <rect width="160" height="220" rx="12" fill="#0b1120" stroke="rgba(255,255,255,0.06)"/>
      <text x="16" y="25" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#cbd5e1">Service Nodes</text>

      <!-- Pod Item 1 -->
      <rect x="12" y="40" width="136" height="38" rx="6" fill="#1e293b"/>
      <circle cx="24" cy="59" r="4" fill="#10b981"/>
      <text x="36" y="55" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#f8fafc">api-gateway</text>
      <text x="36" y="68" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">99.98% • 18 replicas</text>

      <!-- Pod Item 2 -->
      <rect x="12" y="86" width="136" height="38" rx="6" fill="#1e293b"/>
      <circle cx="24" cy="105" r="4" fill="#10b981"/>
      <text x="36" y="101" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#f8fafc">worker-ingest</text>
      <text x="36" y="114" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">99.95% • 32 replicas</text>

      <!-- Pod Item 3 -->
      <rect x="12" y="132" width="136" height="38" rx="6" fill="#1e293b"/>
      <circle cx="24" cy="151" r="4" fill="#3b82f6"/>
      <text x="36" y="147" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#f8fafc">cache-redis-ha</text>
      <text x="36" y="160" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">Ready • 6 nodes</text>

      <!-- Pod Item 4 -->
      <rect x="12" y="178" width="136" height="32" rx="6" fill="#1e293b"/>
      <circle cx="24" cy="194" r="4" fill="#10b981"/>
      <text x="36" y="194" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#f8fafc">db-timescale</text>
    </g>
  </g>
</svg>
