<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="awsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1929" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="awsOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ffb84d" />
    </linearGradient>
  </defs>

  <rect width="800" height="550" rx="16" fill="url(#awsBg)" stroke="#ff9900" stroke-width="3" />
  <rect x="20" y="20" width="760" height="510" rx="10" fill="none" stroke="rgba(255, 153, 0, 0.3)" stroke-width="1.5" />

  <!-- AWS Badge Icon Top Center -->
  <g transform="translate(360, 50)">
    <polygon points="40,0 75,20 75,60 40,80 5,60 5,20" fill="#232f3e" stroke="#ff9900" stroke-width="3"/>
    <text x="40" y="47" font-family="'Arial', sans-serif" font-weight="bold" font-size="22" fill="#ff9900" text-anchor="middle">AWS</text>
  </g>

  <text x="400" y="165" font-family="'Arial', sans-serif" font-size="24" font-weight="bold" fill="#f8fafc" text-anchor="middle" letter-spacing="2">AWS CERTIFIED SOLUTIONS ARCHITECT</text>
  <text x="400" y="195" font-family="'Arial', sans-serif" font-size="14" fill="#ff9900" text-anchor="middle" letter-spacing="3">ASSOCIATE LEVEL - CLOUD ARCHITECTURE</text>

  <line x1="200" y1="215" x2="600" y2="215" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />

  <text x="400" y="260" font-family="'Arial', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">This verifies that student engineers of</text>
  <text x="400" y="300" font-family="'Arial', sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">SYNAPSE COLLECTIVE TEAM</text>

  <text x="400" y="340" font-family="'Arial', sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">
    have demonstrated comprehensive knowledge of distributed cloud architecture, VPC design,
  </text>
  <text x="400" y="365" font-family="'Arial', sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">
    high-availability Kubernetes clusters, serverless computing, and IAM security controls.
  </text>

  <!-- Verification Details Box -->
  <g transform="translate(180, 400)">
    <rect width="440" height="60" rx="8" fill="#111827" stroke="rgba(255,255,255,0.1)" />
    <text x="30" y="26" font-family="'Courier New', monospace" font-size="11" fill="#94a3b8">Validation Number:</text>
    <text x="170" y="26" font-family="'Courier New', monospace" font-size="11" fill="#38bdf8">SYN-AWS-8849204-VALID</text>
    <text x="30" y="46" font-family="'Courier New', monospace" font-size="11" fill="#94a3b8">Active Period:</text>
    <text x="170" y="46" font-family="'Courier New', monospace" font-size="11" fill="#34d399">2025 – 2028 (Status: Verified)</text>
  </g>

  <!-- Fictional Sample Notice -->
  <text x="400" y="500" font-family="'Courier New', monospace" font-size="11" fill="#ff9900" text-anchor="middle">
    ★ FICTIONAL SAMPLE CERTIFICATE DEMONSTRATION FOR TEAM PORTFOLIO ★
  </text>
</svg>
