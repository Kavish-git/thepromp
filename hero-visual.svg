<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="500" rx="24" fill="url(#bgGrad)" />
  <rect width="600" height="500" rx="24" fill="url(#gridPattern)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="120" r="90" fill="#6366f1" opacity="0.25" filter="url(#glow)" />
  <circle cx="450" cy="380" r="100" fill="#ec4899" opacity="0.2" filter="url(#glow)" />
  <circle cx="480" cy="140" r="80" fill="#06b6d4" opacity="0.2" filter="url(#glow)" />

  <!-- Code Editor Main Card -->
  <g transform="translate(60, 55)">
    <!-- Window Frame -->
    <rect width="480" height="320" rx="16" fill="#1e293b" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
    <!-- Window Controls -->
    <circle cx="25" cy="22" r="6" fill="#ef4444" />
    <circle cx="45" cy="22" r="6" fill="#f59e0b" />
    <circle cx="65" cy="22" r="6" fill="#10b981" />
    <text x="240" y="26" font-family="'Courier New', monospace" font-size="12" fill="#94a3b8" text-anchor="middle">SynapseCollective.ts - Production Ready</text>
    <line x1="0" y1="42" x2="480" y2="42" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Code Editor Content -->
    <g transform="translate(25, 65)" font-family="'Fira Code', 'Courier New', monospace" font-size="12">
      <!-- Line 1 -->
      <text x="0" y="0" fill="#64748b">01</text>
      <text x="30" y="0" fill="#f43f5e">import</text>
      <text x="80" y="0" fill="#f8fafc">{ Team, Innovation, Speed }</text>
      <text x="285" y="0" fill="#f43f5e">from</text>
      <text x="325" y="0" fill="#38bdf8">'@synapse/core'</text>
      <text x="420" y="0" fill="#94a3b8">;</text>

      <!-- Line 2 -->
      <text x="0" y="24" fill="#64748b">02</text>
      <text x="30" y="24" fill="#64748b">// Student Engineers &amp; AI Builders</text>

      <!-- Line 3 -->
      <text x="0" y="48" fill="#64748b">03</text>
      <text x="30" y="48" fill="#818cf8">export const</text>
      <text x="125" y="48" fill="#38bdf8">collective</text>
      <text x="205" y="48" fill="#f8fafc">=</text>
      <text x="220" y="48" fill="#f43f5e">new</text>
      <text x="250" y="48" fill="#fbbf24">SynapseDevs</text>
      <text x="330" y="48" fill="#f8fafc">({</text>

      <!-- Line 4 -->
      <text x="0" y="72" fill="#64748b">04</text>
      <text x="45" y="72" fill="#a5b4fc">status:</text>
      <text x="110" y="72" fill="#34d399">'Open to Internships &amp; Collab'</text>
      <text x="335" y="72" fill="#94a3b8">,</text>

      <!-- Line 5 -->
      <text x="0" y="96" fill="#64748b">05</text>
      <text x="45" y="96" fill="#a5b4fc">focus:</text>
      <text x="100" y="96" fill="#f8fafc">[</text>
      <text x="115" y="96" fill="#38bdf8">'Next.js'</text>
      <text x="175" y="96" fill="#94a3b8">,</text>
      <text x="190" y="96" fill="#38bdf8">'FastAPI'</text>
      <text x="255" y="96" fill="#94a3b8">,</text>
      <text x="270" y="96" fill="#38bdf8">'AI Agents'</text>
      <text x="345" y="96" fill="#f8fafc">],</text>

      <!-- Line 6 -->
      <text x="0" y="120" fill="#64748b">06</text>
      <text x="45" y="120" fill="#a5b4fc">shippedProjects:</text>
      <text x="175" y="120" fill="#f59e0b">18</text>
      <text x="195" y="120" fill="#94a3b8">,</text>
      <text x="210" y="120" fill="#a5b4fc">hackathonsWon:</text>
      <text x="325" y="120" fill="#f59e0b">4</text>

      <!-- Line 7 -->
      <text x="0" y="144" fill="#64748b">07</text>
      <text x="30" y="144" fill="#f8fafc">});</text>

      <!-- Line 8 -->
      <text x="0" y="168" fill="#64748b">08</text>
      <text x="30" y="168" fill="#818cf8">await</text>
      <text x="75" y="168" fill="#38bdf8">collective</text>
      <text x="145" y="168" fill="#f8fafc">.</text>
      <text x="155" y="168" fill="#fbbf24">deployToCloud</text>
      <text x="255" y="168" fill="#f8fafc">({</text>
      <text x="275" y="168" fill="#a5b4fc">reliability:</text>
      <text x="365" y="168" fill="#34d399">'99.9%'</text>
      <text x="415" y="168" fill="#f8fafc">});</text>
    </g>

    <!-- Mini Terminal Bar inside editor -->
    <rect x="25" y="240" width="430" height="60" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.06)" />
    <text x="40" y="262" font-family="'Courier New', monospace" font-size="11" fill="#34d399">✔ Tests passed: 48/48 (100% coverage)</text>
    <text x="40" y="282" font-family="'Courier New', monospace" font-size="11" fill="#38bdf8">🚀 Synapse Production cluster v2.4 active • latency: 14ms</text>
  </g>

  <!-- Floating Badge 1: Top Right Tech Stack -->
  <g transform="translate(420, 25)">
    <rect width="150" height="52" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="28" cy="26" r="14" fill="#6366f1" opacity="0.2" />
    <text x="28" y="31" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#818cf8" text-anchor="middle">⚡</text>
    <text x="52" y="22" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#f8fafc">Full-Stack AI</text>
    <text x="52" y="38" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Modern Architecture</text>
  </g>

  <!-- Floating Badge 2: Bottom Left Hackathon Badge -->
  <g transform="translate(30, 390)">
    <rect width="210" height="65" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="32" cy="32" r="18" fill="#f59e0b" opacity="0.2" />
    <text x="32" y="38" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">🏆</text>
    <text x="60" y="26" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#fbbf24">Hackathon Winners</text>
    <text x="60" y="44" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">1st Place MIT HackNation</text>
  </g>

  <!-- Floating Badge 3: Bottom Right Live Status -->
  <g transform="translate(380, 400)">
    <rect width="180" height="55" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <circle cx="25" cy="27" r="6" fill="#10b981" />
    <circle cx="25" cy="27" r="10" fill="#10b981" opacity="0.3" />
    <text x="42" y="24" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#f8fafc">Available to Hire</text>
    <text x="42" y="40" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Internships &amp; Contracts</text>
  </g>
</svg>
