<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Studio Gradient -->
    <radialGradient id="riyaStudioBg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3b1d3d"/>
      <stop offset="55%" stop-color="#1d0e20"/>
      <stop offset="100%" stop-color="#0b050d"/>
    </radialGradient>

    <!-- Natural Skin Tone -->
    <linearGradient id="riyaSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2aa85"/>
      <stop offset="70%" stop-color="#cd926d"/>
      <stop offset="100%" stop-color="#b67a54"/>
    </linearGradient>
    <linearGradient id="riyaNeckShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9d6440"/>
      <stop offset="100%" stop-color="#be7f58"/>
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="riyaHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1b18"/>
      <stop offset="60%" stop-color="#190e0b"/>
      <stop offset="100%" stop-color="#0a0504"/>
    </linearGradient>

    <!-- Professional Blazer (Plum / Navy Corporate) -->
    <linearGradient id="riyaBlazer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a154b"/>
      <stop offset="100%" stop-color="#28092a"/>
    </linearGradient>

    <filter id="riyaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <clipPath id="riyaClip">
    <circle cx="200" cy="200" r="195"/>
  </clipPath>

  <g clip-path="url(#riyaClip)">
    <rect width="400" height="400" fill="url(#riyaStudioBg)"/>

    <!-- Soft Rim Light Glow -->
    <ellipse cx="200" cy="380" rx="160" ry="80" fill="#ec4899" opacity="0.15"/>

    <!-- Hair Back Volume -->
    <path d="M 120 160 C 105 240, 115 310, 135 340 L 265 340 C 285 310, 295 240, 280 160 Z" fill="url(#riyaHair)"/>

    <!-- Professional Blazer -->
    <path d="M 60 400 C 65 330, 110 300, 150 290 L 250 290 C 290 300, 335 330, 340 400 Z" fill="url(#riyaBlazer)" filter="url(#riyaShadow)"/>

    <!-- Inner Top (Soft Cream / Silk Top) -->
    <path d="M 165 290 Q 200 360 235 290 Z" fill="#fdf2f8"/>

    <!-- Blazer Lapels -->
    <path d="M 125 310 L 180 395 L 195 395 L 165 305 Z" fill="#350f36"/>
    <path d="M 275 310 L 220 395 L 205 395 L 235 305 Z" fill="#2d0c2e"/>

    <!-- Neck -->
    <path d="M 174 225 L 174 290 C 174 296, 226 296, 226 290 L 226 225 Z" fill="url(#riyaSkin)"/>
    <path d="M 174 225 C 185 248, 215 248, 226 225 L 226 248 C 215 264, 185 264, 174 248 Z" fill="url(#riyaNeckShadow)" opacity="0.6"/>

    <!-- Face (Feminine, graceful, confident) -->
    <path d="M 140 155 C 140 88, 260 88, 260 155 C 260 216, 232 244, 200 244 C 168 244, 140 216, 140 155 Z" fill="url(#riyaSkin)" filter="url(#riyaShadow)"/>

    <!-- Subtle Cheek Contours -->
    <circle cx="162" cy="180" r="14" fill="#f43f5e" opacity="0.12"/>
    <circle cx="238" cy="180" r="14" fill="#f43f5e" opacity="0.12"/>

    <!-- Ears -->
    <path d="M 137 150 C 131 150, 131 180, 141 180 Z" fill="#cd926d"/>
    <path d="M 263 150 C 269 150, 269 180, 259 180 Z" fill="#c3855e"/>

    <!-- Small Professional Pearl Earring -->
    <circle cx="135" cy="178" r="3.5" fill="#fdf4ff"/>
    <circle cx="265" cy="178" r="3.5" fill="#fdf4ff"/>

    <!-- Elegant Flowing Hair Front & Parting -->
    <path d="M 135 140 C 132 85, 160 52, 200 52 C 245 52, 268 85, 265 140 C 262 108, 240 82, 195 82 C 155 82, 140 108, 135 140 Z" fill="url(#riyaHair)"/>
    <!-- Left hair side strand -->
    <path d="M 136 120 C 130 180, 140 230, 148 245 C 144 210, 140 170, 146 130 Z" fill="#190e0b"/>
    <!-- Right hair side strand -->
    <path d="M 264 120 C 270 180, 260 230, 252 245 C 256 210, 260 170, 254 130 Z" fill="#190e0b"/>

    <!-- Eyebrows (Arched, elegant) -->
    <path d="M 154 136 Q 168 128 182 134" stroke="#190e0b" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 218 134 Q 232 128 246 136" stroke="#190e0b" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Eyes (Almond, sharp, intelligent) -->
    <path d="M 154 148 Q 168 141 181 148 Q 168 156 154 148 Z" fill="#ffffff"/>
    <circle cx="168" cy="148" r="5" fill="#20110d"/>
    <circle cx="169" cy="146" r="1.8" fill="#ffffff"/>
    <path d="M 152 147 Q 168 139 182 147" stroke="#190e0b" stroke-width="2" fill="none"/>

    <path d="M 219 148 Q 232 141 246 148 Q 232 156 219 148 Z" fill="#ffffff"/>
    <circle cx="232" cy="148" r="5" fill="#20110d"/>
    <circle cx="233" cy="146" r="1.8" fill="#ffffff"/>
    <path d="M 218 147 Q 232 139 248 147" stroke="#190e0b" stroke-width="2" fill="none"/>

    <!-- Nose (Graceful) -->
    <path d="M 198 148 L 196 179 Q 200 184 204 179" stroke="#ab724b" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Warm Professional Smile with Natural Lip Tone -->
    <path d="M 183 204 Q 200 216 217 204" stroke="#9f3a4b" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 185 205 Q 200 214 215 205" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Border Ring -->
  <circle cx="200" cy="200" r="195" fill="none" stroke="#ec4899" stroke-width="6"/>
</svg>
